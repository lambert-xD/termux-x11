strict_tdd: true
context: |
  termux-x11 is an Android Gradle app wrapping a Wayland compositor & X11 server.
  Primary test runner: ./gradlew test (Gradle).
  No unit/integration/E2E test files currently present.
  Quality tools: Android Lint via ./gradlew lint. Type check via compilation.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: "./gradlew test"
  verify:
    test_command: "./gradlew test"
testing:
  detected: "2026-06-07"
  runner:
    command: "./gradlew test"
    framework: "Gradle test"
  layers:
    unit: "Gradle test"
    integration: ""
    e2e: ""
  commands:
    unit:
      - scope: "."
        command: "./gradlew test"
        framework: "Gradle test"
    integration:
      []
    e2e:
      []
  coverage:
    command: ""
    commands:
      []
quality:
  lint: "Android Lint"
  lint_commands:
    - scope: "."
      command: "./gradlew lint"
  typecheck: "Kotlin/Java Compiler"
  typecheck_commands:
    - scope: "."
      command: "./gradlew compileDebugSources"
  format: ""
  format_commands:
    []
